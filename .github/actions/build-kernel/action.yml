name: Build committed NX809J kernel
description: Verify pinned toolchains and compile the immutable real-38 source

inputs:
  source_dir:
    description: Clean checkout of the commit in nx809j-source-lock.json
    required: true
  toolchain_dir:
    description: Directory for the verified toolchains
    required: true
  output_dir:
    description: Separate kernel build output directory
    required: true
  artifact_dir:
    description: Directory for Image, modules, symbols and build logs
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify toolchains
      shell: bash
      env:
        TOOLCHAIN_DIR: ${{ inputs.toolchain_dir }}
      run: python3 scripts/nx809j/fetch-toolchains.py nx809j-source-lock.json "$TOOLCHAIN_DIR"

    - name: Compile committed kernel source
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        TOOLCHAIN_DIR: ${{ inputs.toolchain_dir }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: bash scripts/nx809j/build-kernel.sh "$SOURCE_DIR" "$TOOLCHAIN_DIR" "$OUTPUT_DIR" "$ARTIFACT_DIR"

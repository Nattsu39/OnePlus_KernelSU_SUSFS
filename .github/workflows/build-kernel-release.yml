name: Build NX809J ReSukiSU 6.12.38

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NX809J real-38 source build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read pinned kernel source
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("nx809j-source-lock.json", encoding="utf-8") as stream:
              source = json.load(stream)["kernel"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={source['repository']}\n")
              output.write(f"commit={source['commit']}\n")
          PY

      - name: Checkout committed kernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: kernel
          persist-credentials: false

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev file kmod rsync
          df -h "$RUNNER_TEMP"
          free -h

      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          source_dir: ${{ github.workspace }}/kernel
          toolchain_dir: ${{ runner.temp }}/nx809j-toolchains
          output_dir: ${{ runner.temp }}/nx809j-kernel-out
          artifact_dir: ${{ runner.temp }}/nx809j-artifacts

      - name: Upload kernel and diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NX809J-ReSukiSU-6.12.38-${{ github.run_number }}
          path: ${{ runner.temp }}/nx809j-artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Write build summary
        if: ${{ always() }}
        shell: bash
        env:
          KERNEL_REPOSITORY: ${{ steps.source.outputs.repository }}
          KERNEL_COMMIT: ${{ steps.source.outputs.commit }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo "NX809J Android 16 / Linux 6.12.38 / ReSukiSU + SUSFS"
            echo
            echo "Kernel: [$KERNEL_COMMIT](https://github.com/$KERNEL_REPOSITORY/commit/$KERNEL_COMMIT)"
            echo
            echo "Status: $BUILD_STATUS"
            echo
            echo "Artifacts include Image, modules, kernel.config, Module.symvers, System.map, vmlinux, provenance and SHA256SUMS."
          } >> "$GITHUB_STEP_SUMMARY"
